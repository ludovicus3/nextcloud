# Default values for nextcloud.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  path: /
  pathType: Prefix
  tls:
    enabled: false
    create: false
    existingSecret:
    issuer:
      kind:
      group: ""
      name:

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http


  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

auth:
  existingSecret:
  secretKeys:
    adminUsernameKey:
    adminPasswordKey:

smtp:
  enabled: false
  host:
  port: 465
  secure: ssl
  domain:
  fromAddress:
  authtype: LOGIN
  auth:
    secretName:
    usernameKey:
    passwordKey:

nextcloud:
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  replicaCount: 1
  strategy:
    type: Recreate
  image:
    registry: ghcr.io/ludovicus3
    repository: nextcloud
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  data:
    path: /var/www/html/data
  containerPort: 9000
  service:
    type: ClusterIP
    port: 9000

persistence:
  enabled: true
  annotations: {}
  labels: {}
  storageClass:
  existingClaimName:
  accessModes:
    - ReadWriteMany
  size: 10Gi

  data:
    enabled: true
    subPath:
    annotations: {}
    labels: {}
    storageClass:
    existingClaimName:
    accessModes:
      - ReadWriteMany
    size: 100Gi

proxy:
  enabled: true
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  config:
    headers:
      Referrer-Policy: "no-referrer"
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      X-Permitted-Cross-Domain-Policies: "none"
      X-Robots-Tag: "noindex, nofollow"
      X-XSS-Protection: "1; mode=block"
      Strict-Transport-Security: "max-age=15768000; includeSubDomains; preload"
    serverBlockCustom: |-
      # set max upload size
      client_max_body_size 10G;
      client_body_timeout 300s;
      fastcgi_buffers 64 4K;
      fastcgi_read_timeout 3600s;
  replicaCount: 1

  trustedIPs:
  ipFamilies: []
  containerPort: 8080

  image:
    repository: nginxinc/nginx-unprivileged
    registry: docker.io
    tag: stable
    digest:

  service:
    port: 80

cronjob:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  faildJobsHistoryLimit: 5
  command:
    - php
    - -f
    - /var/www/html/cron.php
    - --
    - --verbose
  securityContext: {}

minio:
  enabled: false

postgresql:
  enabled: false
  auth:
    database: nextcloud
    username: nextcloud

redis:
  enabled: false
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false
    replicaCount: 1

