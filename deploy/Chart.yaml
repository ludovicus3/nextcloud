apiVersion: v2
name: nextcloud
description: A Helm chart for Kubernetes
icon: file://./logo_nextcloud_white.svg
type: application
version: 0.1.1
appVersion: "v33.0.5"
dependencies:
  - name: common
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 2.31.4
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 18.2.3
    condition: postgresql.enabled
  - name: redis
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 24.1.2
    condition: redis.enabled
