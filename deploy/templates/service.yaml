kind: Service
apiVersion: v1
metadata:
  name: {{ include "nextcloud.fpm.fullname" . }}
  namespace: {{ include "common.names.namespace" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: nextcloud
spec:
  type: {{ .Values.nextcloud.service.type }}
  {{- if (eq .Values.nextcloud.service.type "LoadBalancer") }}
  {{- with .Values.nextcloud.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- end }}
  {{- with .Values.nextcloud.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nextcloud.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.nextcloud.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- with .Values.nextcloud.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: fcgi
      protocol: TCP
      port: {{ .Values.nextcloud.service.port }}
      targetPort: fcgi
      {{- with .Values.nextcloud.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: fpm
