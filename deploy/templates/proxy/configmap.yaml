kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "nextcloud.proxy.fullname" . }}
  namespace: {{ include "common.names.namespace" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  nextcloud.conf: |-
    {{- tpl (.Files.Get "files/nginx.conf") . | nindent 4 }}