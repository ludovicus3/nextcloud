[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = ${LISTEN_PORT:-9000}

access.log = /proc/self/fd/1
access.suppress_path[] = /ping
access.suppress_path[] = /status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = static
pm.max_children = 10
pm.status_path = /status
ping.path = /ping
ping.response = OK
